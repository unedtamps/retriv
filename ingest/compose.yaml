name: retriv-ingest

x-worker-environment: &worker-environment
  INTERNAL_COMPONENT: worker
  INTERNAL_ENVIRONMENT: ${INTERNAL_ENVIRONMENT:-local}
  INTERNAL_DATABASE_URL: postgresql+asyncpg://${INTERNAL_POSTGRES_USER}:${INTERNAL_POSTGRES_PASSWORD}@context-postgres:5432/${INTERNAL_POSTGRES_DB}
  INTERNAL_PIPELINE_VERSION: ${INTERNAL_PIPELINE_VERSION:-2026.1}
  INTERNAL_DOCLING_ARTIFACTS_PATH: ${INTERNAL_DOCLING_ARTIFACTS_PATH:-/opt/docling-models}
  INTERNAL_OCR_LANGUAGES: ${INTERNAL_OCR_LANGUAGES:-["ind","eng"]}
  INTERNAL_CHUNK_MAX_TOKENS: ${INTERNAL_CHUNK_MAX_TOKENS:-700}
  INTERNAL_MAX_SOURCE_BYTES: ${INTERNAL_MAX_SOURCE_BYTES:-52428800}
  INTERNAL_MAX_CHUNKS_PER_DOCUMENT: ${INTERNAL_MAX_CHUNKS_PER_DOCUMENT:-10000}
  INTERNAL_MAX_ARTIFACT_BYTES: ${INTERNAL_MAX_ARTIFACT_BYTES:-104857600}
  INTERNAL_MAX_EXTRACTED_TEXT_BYTES: ${INTERNAL_MAX_EXTRACTED_TEXT_BYTES:-52428800}
  INTERNAL_MAX_CHUNK_PAYLOAD_BYTES: ${INTERNAL_MAX_CHUNK_PAYLOAD_BYTES:-104857600}
  INTERNAL_PROCESSING_TIMEOUT_SECONDS: ${INTERNAL_PROCESSING_TIMEOUT_SECONDS:-1800}
  INTERNAL_ARTIFACT_RECONCILIATION_INTERVAL_SECONDS: ${INTERNAL_ARTIFACT_RECONCILIATION_INTERVAL_SECONDS:-300}
  INTERNAL_EMBEDDING_BASE_URL: ${INTERNAL_EMBEDDING_CONTAINER_BASE_URL:-http://host.docker.internal:1234/v1}
  INTERNAL_EMBEDDING_API_KEY: ${INTERNAL_EMBEDDING_API_KEY:?INTERNAL_EMBEDDING_API_KEY is required}
  INTERNAL_EMBEDDING_MODEL: ${INTERNAL_EMBEDDING_MODEL:-text-embedding-qwen3-embedding-8b}
  INTERNAL_EMBEDDING_PROFILE: ${INTERNAL_EMBEDDING_PROFILE:-qwen3-embedding-8b-4096-v1}
  INTERNAL_EMBEDDING_DIMENSIONS: ${INTERNAL_EMBEDDING_DIMENSIONS:-4096}
  INTERNAL_EMBEDDING_BATCH_SIZE: ${INTERNAL_EMBEDDING_BATCH_SIZE:-16}
  INTERNAL_EMBEDDING_TIMEOUT_SECONDS: ${INTERNAL_EMBEDDING_TIMEOUT_SECONDS:-120}
  INTERNAL_EMBEDDING_RECONCILIATION_INTERVAL_SECONDS: ${INTERNAL_EMBEDDING_RECONCILIATION_INTERVAL_SECONDS:-300}
  INTERNAL_QDRANT_URL: http://qdrant:6333
  INTERNAL_QDRANT_API_KEY: ${INTERNAL_QDRANT_API_KEY:?INTERNAL_QDRANT_API_KEY is required}
  INTERNAL_QDRANT_COLLECTION: ${INTERNAL_QDRANT_COLLECTION:-retriv-chunks-qwen3-8b-4096-v1}
  INTERNAL_QDRANT_TIMEOUT_SECONDS: ${INTERNAL_QDRANT_TIMEOUT_SECONDS:-30}
  INTERNAL_QDRANT_VECTORS_ON_DISK: ${INTERNAL_QDRANT_VECTORS_ON_DISK:-true}
  INTERNAL_PARSER_MEMORY_LIMIT_BYTES: ${INTERNAL_PARSER_MEMORY_LIMIT_BYTES:-8589934592}
  INTERNAL_PARSER_MAX_PROCESSES: ${INTERNAL_PARSER_MAX_PROCESSES:-4096}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${INTERNAL_POSTGRES_DB:?INTERNAL_POSTGRES_DB is required}
      POSTGRES_USER: ${INTERNAL_POSTGRES_USER:?INTERNAL_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${INTERNAL_POSTGRES_PASSWORD:?INTERNAL_POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      context:
        aliases:
          - context-postgres

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${INTERNAL_QDRANT_API_KEY:?INTERNAL_QDRANT_API_KEY is required}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${INTERNAL_QDRANT_READ_ONLY_API_KEY:?INTERNAL_QDRANT_READ_ONLY_API_KEY is required}
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    networks:
      - context

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 10g
    cpus: 4
    pids_limit: 320
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=4g,mode=1777
    command: ["python", "-m", "worker"]
    environment:
      <<: *worker-environment
      INTERNAL_S3_ENDPOINT_URL: ${INTERNAL_S3_CONTAINER_ENDPOINT_URL:-http://minio:9000}
      INTERNAL_S3_ACCESS_KEY: ${INTERNAL_S3_ACCESS_KEY:?INTERNAL_S3_ACCESS_KEY is required}
      INTERNAL_S3_SECRET_KEY: ${INTERNAL_S3_SECRET_KEY:?INTERNAL_S3_SECRET_KEY is required}
      INTERNAL_S3_RAW_BUCKET: ${INTERNAL_S3_RAW_BUCKET:-raw-documents}
      INTERNAL_S3_ARTIFACT_BUCKET: ${INTERNAL_S3_ARTIFACT_BUCKET:-context-documents}
      INTERNAL_S3_REGION: ${INTERNAL_S3_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - context
      - source-ingestion

networks:
  context:
    ipam:
      config:
        - subnet: ${INTERNAL_DOCKER_SUBNET:-10.254.0.0/24}
  source-ingestion:
    external: true
    name: retriv-api_api-net

volumes:
  postgres_data:
  qdrant_data:
