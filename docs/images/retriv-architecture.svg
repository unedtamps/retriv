<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790" font-family="Inter, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3d4b5c"/>
    </marker>
    <style>
      .bg { fill: #0b0f14; }
      .card { fill: #121821; stroke: #1f2833; stroke-width: 1; }
      .card-strong { fill: #121821; stroke: #2e3a49; stroke-width: 1; }
      .inner { fill: #0b0f14; stroke: #1f2833; stroke-width: 1; }
      .accent-fill { fill: #16212e; stroke: #22405f; }
      .label { fill: #71818f; font-size: 11px; font-weight: 600; letter-spacing: 1.6px; }
      .title { fill: #dde5ef; font-size: 17px; font-weight: 600; }
      .sub { fill: #dde5ef; font-size: 13.5px; font-weight: 600; }
      .tag { fill: #71818f; font-size: 11px; font-family: monospace; }
      .tag-accent { fill: #8db6de; font-size: 11px; font-family: monospace; }
      .body { fill: #9baabb; font-size: 12.5px; }
      .body-sm { fill: #9baabb; font-size: 11.5px; }
      .faint { fill: #71818f; font-size: 11.5px; }
      .micro { fill: #71818f; font-size: 10.5px; font-weight: 600; letter-spacing: 1.2px; }
      .link { stroke: #2e3a49; stroke-width: 1.25; fill: none; }
      .divider { stroke: #1f2833; stroke-width: 1; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="790"/>
  <text class="label" x="60" y="52">01  SURFACES</text>
  <text class="label" x="420" y="52">02  APPLICATION</text>
  <text class="label" x="840" y="52">03  DATA PLANE</text>
  <text class="label" x="1240" y="52">04  RUNTIME</text>
  <rect class="card" x="60" y="80" width="300" height="112" rx="4"/>
  <text class="title" x="84" y="116">Dashboard</text>
  <text class="tag" x="84" y="136">react . vite</text>
  <text class="body" x="84" y="162">Catalogue, upload, members,</text>
  <text class="body" x="84" y="179">inline document preview.</text>
  <rect class="card" x="60" y="216" width="300" height="128" rx="4"/>
  <text class="title" x="84" y="252">MCP client</text>
  <text class="tag" x="84" y="272">agent . rk_ api key</text>
  <text class="body" x="84" y="298">Claude Code, Codex or a</text>
  <text class="body" x="84" y="315">custom agent. Read-only</text>
  <text class="body" x="84" y="332">tools over streamable HTTP.</text>
  <path class="link" d="M360 136 H420" marker-end="url(#arrow)"/>
  <path class="link" d="M360 280 H420" marker-end="url(#arrow)"/>
  <rect class="card-strong" x="420" y="80" width="360" height="524" rx="4"/>
  <text class="title" x="444" y="116">app/</text>
  <text class="tag tag-accent" x="444" y="136">fastapi</text>
  <text class="body" x="444" y="160">Scoped request router. Holds no</text>
  <text class="body" x="444" y="177">document state of its own.</text>
  <line class="divider" x1="444" y1="196" x2="756" y2="196"/>
  <rect class="inner" x="444" y="210" width="312" height="74" rx="3"/>
  <text class="sub" x="460" y="234">Auth</text>
  <text class="tag" x="460" y="254">jwt + rotation . api keys . roles</text>
  <text class="faint" x="460" y="272">Access token renewed by rotation.</text>
  <rect class="inner" x="444" y="292" width="312" height="74" rx="3"/>
  <text class="sub" x="460" y="316">Intake</text>
  <text class="tag" x="460" y="336">scan . validate . store . link</text>
  <text class="faint" x="460" y="354">Content hash decides identity.</text>
  <rect class="inner" x="444" y="374" width="312" height="74" rx="3"/>
  <text class="sub" x="460" y="398">Retrieval</text>
  <text class="tag" x="460" y="418">vector + sql . cross-workspace</text>
  <text class="faint" x="460" y="436">Scope resolved on every request.</text>
  <rect class="inner" x="444" y="456" width="312" height="74" rx="3"/>
  <text class="sub" x="460" y="480">MCP</text>
  <text class="tag" x="460" y="500">/mcp . 7 tools + query_rows</text>
  <text class="faint" x="460" y="518">Mounted inside this process.</text>
  <text class="faint" x="444" y="566">Scope comes from membership, never</text>
  <text class="faint" x="444" y="583">from the client.</text>
  <path class="link" d="M780 130 H840" marker-end="url(#arrow)"/>
  <path class="link" d="M780 290 H840" marker-end="url(#arrow)"/>
  <path class="link" d="M780 480 H840" marker-end="url(#arrow)"/>
  <path class="link" d="M780 170 C 1010 170 1030 140 1240 140" marker-end="url(#arrow)"/>
  <text class="faint" x="900" y="132" font-size="10.5">via postgres queue</text>
  <rect class="card" x="840" y="80" width="340" height="106" rx="4"/>
  <text class="title" x="864" y="114">PostgreSQL</text>
  <text class="tag" x="864" y="132">truth . queue</text>
  <text class="body" x="864" y="156">Documents, workspace links, runs,</text>
  <text class="body" x="864" y="173">chunks, CSV rows, refresh tokens.</text>
  <rect class="card" x="840" y="206" width="340" height="106" rx="4"/>
  <text class="title" x="864" y="240">pgvector</text>
  <text class="tag" x="864" y="258">inside PostgreSQL</text>
  <text class="body" x="864" y="282">vector(2000) column on the ledger,</text>
  <text class="body" x="864" y="299">HNSW cosine, scope joined live.</text>
  <rect class="card" x="840" y="332" width="340" height="256" rx="4"/>
  <text class="title" x="864" y="366">S3 / R2</text>
  <text class="tag" x="864" y="384">two buckets . one scoped identity</text>
  <rect class="accent-fill" x="864" y="400" width="292" height="78" rx="3"/>
  <text class="body" x="880" y="424" font-weight="600" fill="#dde5ef" font-size="12.5">raw-documents</text>
  <text class="tag" x="880" y="442">content-addressed, immutable</text>
  <text class="faint" x="880" y="460">Original upload, keyed by sha256.</text>
  <rect class="accent-fill" x="864" y="490" width="292" height="78" rx="3"/>
  <text class="body" x="880" y="514" font-weight="600" fill="#dde5ef" font-size="12.5">context-documents</text>
  <text class="tag" x="880" y="532">versioned per run</text>
  <text class="faint" x="880" y="550">Extracted artifacts + image previews.</text>
  <rect class="card-strong" x="1240" y="80" width="300" height="508" rx="4"/>
  <text class="title" x="1264" y="114">worker/</text>
  <text class="tag tag-accent" x="1264" y="132">n replicas . one lease per run</text>
  <text class="body" x="1264" y="156">Claims a run, holds it under a</text>
  <text class="body" x="1264" y="173">lease, releases it on shutdown.</text>
  <line class="divider" x1="1264" y1="190" x2="1516" y2="190"/>
  <text class="micro" x="1264" y="214">EXTRACT</text>
  <text class="body" x="1264" y="234">Native markdown extraction in a</text>
  <text class="body" x="1264" y="251">sandboxed subprocess:</text>
  <text class="tag" x="1264" y="270">pymupdf . python-docx</text>
  <text class="tag" x="1264" y="287">rapidocr (onnx)</text>
  <text class="micro" x="1264" y="320">DESCRIBE</text>
  <text class="body" x="1264" y="340">Each curated picture is sent to</text>
  <text class="body" x="1264" y="357">the VLM once, then stored.</text>
  <text class="micro" x="1264" y="390">CHUNK + EMBED</text>
  <text class="body" x="1264" y="410">Section-aware chunks, 2000-dim</text>
  <text class="body" x="1264" y="427">vectors, batched UPDATEs.</text>
  <text class="micro" x="1264" y="460">RECONCILE</text>
  <text class="body" x="1264" y="480">Re-embeds on profile drift; scope</text>
  <text class="body" x="1264" y="497">is read from the links at query time.</text>
  <path class="link" d="M1180 133 H1240" marker-end="url(#arrow)"/>
  <path class="link" d="M1180 460 H1240" marker-end="url(#arrow)"/>
  <rect class="card" x="420" y="648" width="250" height="96" rx="4"/>
  <text class="title" x="444" y="682" font-size="15">ClamAV</text>
  <text class="tag" x="444" y="700">before storage</text>
  <text class="body-sm" x="444" y="723">A file is scanned as staged</text>
  <text class="body-sm" x="444" y="738">bytes, never after upload.</text>
  <path class="link" d="M545 604 V648" marker-end="url(#arrow)"/>
  <rect class="card" x="1240" y="648" width="300" height="96" rx="4"/>
  <text class="title" x="1264" y="682" font-size="15">Model endpoints</text>
  <text class="tag" x="1264" y="700">embeddings . vision</text>
  <text class="body-sm" x="1264" y="723">Embeddings: LM Studio, local.</text>
  <text class="body-sm" x="1264" y="738">Vision: remote OpenAI-compatible.</text>
  <path class="link" d="M1390 588 V648" marker-end="url(#arrow)"/>
  <text class="faint" x="60" y="676" font-size="11">Two processes, one queue, one scoped index.</text>
  <text class="faint" x="60" y="694" font-size="11">No direct HTTP call passes between the API and the worker.</text>
</svg>
