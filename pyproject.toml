[project]
name = "retriv"
version = "0.1.0"
description = "Workspace-scoped document intake, indexing, and question answering"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "boto3>=1.40,<2",
    "defusedxml>=0.7,<1",
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    # Plain pyjwt, not [crypto]: access tokens are HS256. The [crypto]
    # extra existed for the RS256 scope keypair, which is gone now that
    # the answer path is a direct call instead of a delegated token.
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.10,<3",
    "pymupdf>=1.26,<2",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
    "mcp>=2,<3",
]

# Only the worker needs these. It runs in its own container so the API
# image stays around 250 MB instead of 1.7 GB, and so a crash in Docling
# cannot take the API with it.
[project.optional-dependencies]
extraction = [
    "docling>=2,<3",
    "docling-core[chunking-openai]>=2,<3",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.21,<1",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "provisioning", "worker"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: exercises optional production extraction dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = [
    "S101", # Assertions are expected in tests.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "ARG"]
"alembic/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
