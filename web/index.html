<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Retriv workspace administration and access control dashboard"
    />
    <meta name="theme-color" content="#EDF1F6" />
    <script>
      ;(() => {
        const stored = localStorage.getItem('retriv.theme')
        let dark
        if (stored === 'dark' || stored === 'light') {
          dark = stored === 'dark'
        } else {
          dark = window.matchMedia('(prefers-color-scheme: dark)').matches
        }
        const theme = dark ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#0B0F14' : '#EDF1F6')
      })()
    </script>
    <title>Retriv Control Plane</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
