# One project. The app runs on the host; this file provides the services
# it depends on plus the worker.
#
# The worker is the only app process in here, and it is here rather than on
# the host because the extractors load native parsing libraries and an ONNX
# OCR engine, and run a sandboxed subprocess per document. Keeping that in
# its own container is what keeps the API image small and the API process
# free of anything a hostile PDF can reach.

name: retriv-api

# The worker's environment. Every value is the RETRIV_ name the merged
# Settings reads, so there is one settings vocabulary across both processes.
# Note what is absent: the JWT secret. The worker has no use for it and
# should not hold it.
x-worker-environment: &worker-environment
  RETRIV_COMPONENT: worker
  RETRIV_ENVIRONMENT: ${RETRIV_ENVIRONMENT:-local}
  RETRIV_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  RETRIV_PIPELINE_VERSION: ${RETRIV_PIPELINE_VERSION:-2026.1}
  RETRIV_NATIVE_SCAN_TEXT_THRESHOLD: ${RETRIV_NATIVE_SCAN_TEXT_THRESHOLD:-32}
  RETRIV_CHUNK_MAX_TOKENS: ${RETRIV_CHUNK_MAX_TOKENS:-700}
  RETRIV_MAX_SOURCE_BYTES: ${RETRIV_MAX_SOURCE_BYTES:-104857600}
  RETRIV_MAX_CHUNKS_PER_DOCUMENT: ${RETRIV_MAX_CHUNKS_PER_DOCUMENT:-10000}
  RETRIV_MAX_ARTIFACT_BYTES: ${RETRIV_MAX_ARTIFACT_BYTES:-104857600}
  RETRIV_MAX_EXTRACTED_TEXT_BYTES: ${RETRIV_MAX_EXTRACTED_TEXT_BYTES:-52428800}
  RETRIV_MAX_CHUNK_PAYLOAD_BYTES: ${RETRIV_MAX_CHUNK_PAYLOAD_BYTES:-104857600}
  RETRIV_PROCESSING_TIMEOUT_SECONDS: ${RETRIV_PROCESSING_TIMEOUT_SECONDS:-3600}
  # Two runs in flight, one parser sandbox at a time. A sandbox holds at
  # most ~1.6 GB (OCR is the heavy end) -- raising
  # RETRIV_PARSER_MAX_CONCURRENT_EXTRACTIONS means raising mem_limit below
  # by roughly that much per extra parser.
  RETRIV_PROCESSING_MAX_CONCURRENT_RUNS: ${RETRIV_PROCESSING_MAX_CONCURRENT_RUNS:-2}
  RETRIV_PARSER_MAX_CONCURRENT_EXTRACTIONS: ${RETRIV_PARSER_MAX_CONCURRENT_EXTRACTIONS:-1}
  RETRIV_TRACING_ENABLED: ${RETRIV_TRACING_ENABLED:-true}
  RETRIV_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
  RETRIV_ARTIFACT_RECONCILIATION_INTERVAL_SECONDS: ${RETRIV_ARTIFACT_RECONCILIATION_INTERVAL_SECONDS:-300}
  RETRIV_EMBEDDING_BASE_URL: ${RETRIV_EMBEDDING_CONTAINER_BASE_URL:-http://host.docker.internal:1234/v1}
  RETRIV_EMBEDDING_API_KEY: ${RETRIV_EMBEDDING_API_KEY:?RETRIV_EMBEDDING_API_KEY is required}
  RETRIV_EMBEDDING_MODEL: ${RETRIV_EMBEDDING_MODEL:-text-embedding-qwen3-embedding-8b}
  RETRIV_EMBEDDING_PROFILE: ${RETRIV_EMBEDDING_PROFILE:-qwen3-embedding-8b-2000-v1}
  RETRIV_EMBEDDING_DIMENSIONS: ${RETRIV_EMBEDDING_DIMENSIONS:-2000}
  # Request grouping is neutral on the local LM Studio endpoint; the per-text
  # cost is input length and model choice, not batch size.
  RETRIV_EMBEDDING_BATCH_SIZE: ${RETRIV_EMBEDDING_BATCH_SIZE:-16}
  RETRIV_EMBEDDING_TIMEOUT_SECONDS: ${RETRIV_EMBEDDING_TIMEOUT_SECONDS:-120}
  RETRIV_EMBEDDING_RECONCILIATION_INTERVAL_SECONDS: ${RETRIV_EMBEDDING_RECONCILIATION_INTERVAL_SECONDS:-300}
  # The vision stage. The worker is the only component that holds this key:
  # the API never describes a picture, and the extraction sandbox is
  # deliberately without a network.
  RETRIV_VLM_BASE_URL: ${RETRIV_VLM_BASE_URL:-https://zenmux.ai/api/v1/chat/completions}
  RETRIV_VLM_API_KEY: ${RETRIV_VLM_API_KEY:?RETRIV_VLM_API_KEY is required}
  RETRIV_VLM_MODEL: ${RETRIV_VLM_MODEL:-minimax/minimax-m3.1-flash}
  RETRIV_VLM_TIMEOUT_SECONDS: ${RETRIV_VLM_TIMEOUT_SECONDS:-120}
  RETRIV_VLM_MAX_TOKENS: ${RETRIV_VLM_MAX_TOKENS:-8192}
  RETRIV_VLM_MAX_TOKENS_CEILING: ${RETRIV_VLM_MAX_TOKENS_CEILING:-131072}
  RETRIV_VLM_MAX_IMAGES_PER_DOCUMENT: ${RETRIV_VLM_MAX_IMAGES_PER_DOCUMENT:-100}
  RETRIV_VLM_MAX_CONCURRENCY: ${RETRIV_VLM_MAX_CONCURRENCY:-4}
  RETRIV_VLM_MAX_DESCRIPTION_CHARS: ${RETRIV_VLM_MAX_DESCRIPTION_CHARS:-1200}
  RETRIV_VLM_SCAN_PAGE_DESCRIBE: ${RETRIV_VLM_SCAN_PAGE_DESCRIBE:-true}
  RETRIV_VLM_SESSION_HEADER: ${RETRIV_VLM_SESSION_HEADER:-}
  RETRIV_VLM_SESSION_ID: ${RETRIV_VLM_SESSION_ID:-}
  RETRIV_MODEL_WAIT_BASE_SECONDS: ${RETRIV_MODEL_WAIT_BASE_SECONDS:-5}
  RETRIV_MODEL_WAIT_MAX_SECONDS: ${RETRIV_MODEL_WAIT_MAX_SECONDS:-60}
  RETRIV_MODEL_WAIT_TIMEOUT_SECONDS: ${RETRIV_MODEL_WAIT_TIMEOUT_SECONDS:-3600}
  RETRIV_IMAGE_PROCESSING_ENABLED: ${RETRIV_IMAGE_PROCESSING_ENABLED:-true}
  RETRIV_IMAGE_RENDER_SCALE: ${RETRIV_IMAGE_RENDER_SCALE:-2.0}
  RETRIV_IMAGE_MIN_PIXELS: ${RETRIV_IMAGE_MIN_PIXELS:-10000}
  RETRIV_MAX_IMAGE_BYTES: ${RETRIV_MAX_IMAGE_BYTES:-5242880}
  RETRIV_MAX_TOTAL_IMAGE_BYTES: ${RETRIV_MAX_TOTAL_IMAGE_BYTES:-52428800}
  RETRIV_PARSER_MEMORY_LIMIT_BYTES: ${RETRIV_PARSER_MEMORY_LIMIT_BYTES:-4294967296}
  RETRIV_PARSER_MAX_PROCESSES: ${RETRIV_PARSER_MAX_PROCESSES:-4096}
  RETRIV_S3_RAW_BUCKET: ${RETRIV_S3_RAW_BUCKET:-raw-documents}
  RETRIV_S3_ARTIFACT_BUCKET: ${RETRIV_S3_ARTIFACT_BUCKET:-context-documents}
  RETRIV_S3_REGION: ${RETRIV_S3_REGION:-us-east-1}
  RETRIV_S3_ADDRESSING_STYLE: ${RETRIV_S3_ADDRESSING_STYLE:-auto}

services:
  postgres:
    # pgvector build of postgres 17: chunk_embeddings.embedding is a
    # vector(2000) column with an HNSW index, so the vector store is the
    # database the ledger already lived in rather than a second service.
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:7432:5432"
    networks:
      - app-net

  # Creates the read-only role the row-query tool connects as, and grants it
  # SELECT on the three tables. Runs once and exits.
  #
  # It exists because a password must never land in a migration, so 0002 and
  # 0003 grant to this role only if it already exists. Documenting "run this
  # CREATE ROLE by hand" produced a setup that migrated cleanly, failed to
  # start, and said nothing about which step was skipped. Here the step is part
  # of `docker compose up` and cannot be skipped by omission.
  postgres-init:
    image: postgres:17-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "/config/init.sh"]
    environment:
      PGHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      RETRIV_ENVIRONMENT: ${RETRIV_ENVIRONMENT:-local}
      RETRIV_SQL_READER_USER: ${RETRIV_SQL_READER_USER:-retriv_reader}
      RETRIV_SQL_READER_PASSWORD: ${RETRIV_SQL_READER_PASSWORD:?RETRIV_SQL_READER_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docker/postgres/init.sh:/config/init.sh:ro
    networks:
      - app-net

  clamav:
    image: clamav/clamav:1.4_base
    restart: unless-stopped
    environment:
      # Above the 100 MB source limit; MaxScanSize covers expanding archives.
      CLAMD_CONF_StreamMaxLength: 110M
      CLAMD_CONF_MaxFileSize: 110M
      CLAMD_CONF_MaxScanSize: 220M
      CLAMD_CONF_AlertExceedsMax: "yes"
    mem_limit: 4g
    pids_limit: 512
    volumes:
      - clamav_data:/var/lib/clamav
    ports:
      - "127.0.0.1:4410:3310"
    networks:
      - app-net

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    mem_limit: 512m
    pids_limit: 128
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    networks:
      - app-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    # Measured on this stack (scripts/benchmark_extraction.py, 4-cpu cgroup):
    # one sandbox peaks at 0.7-1.0 GiB resident for a 182-410 page PDF, and a
    # batch of three peaks around 2.5 GiB -- they do not sit at their high-water
    # mark simultaneously. The parser's address-space limit (RLIMIT_AS,
    # RETRIV_PARSER_MEMORY_LIMIT_BYTES) is a separate 4 GiB virtual ceiling, not
    # a resident figure. The cgroup is the hard bound: 12g leaves room for the
    # worker itself plus three parsers without letting a pathological document
    # take the host down.
    #
    # CPU is the real limit, not memory: a single parse already drives all four
    # cores (CPU/wall ~3.9x) because of BLAS/ONNX threading inside the sandbox.
    # Raising PARSER_MAX_CONCURRENT_EXTRACTIONS therefore buys wall-clock only
    # while the cores have slack -- at 3 parallel parsers throughput is flat
    # (1.69 vs 1.7 pages/s serial).
    #
    # Scaling the worker SERVICE is what adds throughput, because each container
    # brings its own 4 cores: three containers, one 182-410 page PDF each, ran
    # 956 pages in 225s (4.25 pages/s, 2.57x the serial 1.66 pages/s) with peak
    # ~1.1 GiB per container. Two containers claiming from the queue was
    # verified live: two distinct lease tokens held at once, no double claim
    # (FOR UPDATE SKIP LOCKED). One container extracting during that test
    # measured ~300-400% CPU and ~380-630 MiB resident.
    # So: scale containers for throughput; keep one parser slot per container.
    mem_limit: 12g
    cpus: 4
    pids_limit: 320
    # An extraction sandbox runs far longer than Docker's default 10s stop
    # grace, and being SIGKILLed mid-stage leaves the run's lease written to
    # the row -- the run then looks stuck for the full lease window. The
    # worker hands its own leases back after SHUTDOWN_GRACE_SECONDS (8s); this
    # gives it room to do that and to let a nearly-finished run complete.
    stop_grace_period: 20s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=4g,mode=1777
    command: ["python", "-m", "worker"]
    environment:
      <<: *worker-environment
      RETRIV_S3_ENDPOINT_URL: ${RETRIV_S3_ENDPOINT_URL:-}
      RETRIV_S3_ACCESS_KEY: ${RETRIV_S3_ACCESS_KEY:?RETRIV_S3_ACCESS_KEY is required}
      RETRIV_S3_SECRET_KEY: ${RETRIV_S3_SECRET_KEY:?RETRIV_S3_SECRET_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${RETRIV_DOCKER_SUBNET:-10.254.0.0/24}

volumes:
  postgres_data:
  clamav_data:
