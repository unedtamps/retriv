# One project. The app runs on the host; this file provides the services
# it depends on plus the worker.
#
# The worker is the only app process in here, and it is here rather than on
# the host because Docling and PyTorch need ~1.7 GB, an 8 GiB parser memory
# cap, and a sandboxed subprocess per document. Keeping that in its own
# container is what keeps the API image small and the API process free of
# anything a hostile PDF can reach.

name: retriv-api

# The worker's environment. Every value is the RETRIV_ name the merged
# Settings reads, so there is one settings vocabulary across both processes.
# Note what is absent: the JWT secret and the read-only Qdrant key. The
# worker has no use for them and should not hold them.
x-worker-environment: &worker-environment
  RETRIV_COMPONENT: worker
  RETRIV_ENVIRONMENT: ${RETRIV_ENVIRONMENT:-local}
  RETRIV_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  RETRIV_PIPELINE_VERSION: ${RETRIV_PIPELINE_VERSION:-2026.1}
  RETRIV_DOCLING_ARTIFACTS_PATH: ${RETRIV_DOCLING_ARTIFACTS_PATH:-/opt/docling-models}
  RETRIV_OCR_LANGUAGES: ${RETRIV_OCR_LANGUAGES:-["ind","eng"]}
  RETRIV_CHUNK_MAX_TOKENS: ${RETRIV_CHUNK_MAX_TOKENS:-700}
  RETRIV_MAX_SOURCE_BYTES: ${RETRIV_MAX_SOURCE_BYTES:-52428800}
  RETRIV_MAX_CHUNKS_PER_DOCUMENT: ${RETRIV_MAX_CHUNKS_PER_DOCUMENT:-10000}
  RETRIV_MAX_ARTIFACT_BYTES: ${RETRIV_MAX_ARTIFACT_BYTES:-104857600}
  RETRIV_MAX_EXTRACTED_TEXT_BYTES: ${RETRIV_MAX_EXTRACTED_TEXT_BYTES:-52428800}
  RETRIV_MAX_CHUNK_PAYLOAD_BYTES: ${RETRIV_MAX_CHUNK_PAYLOAD_BYTES:-104857600}
  RETRIV_PROCESSING_TIMEOUT_SECONDS: ${RETRIV_PROCESSING_TIMEOUT_SECONDS:-1800}
  RETRIV_ARTIFACT_RECONCILIATION_INTERVAL_SECONDS: ${RETRIV_ARTIFACT_RECONCILIATION_INTERVAL_SECONDS:-300}
  RETRIV_EMBEDDING_BASE_URL: ${RETRIV_EMBEDDING_CONTAINER_BASE_URL:-http://host.docker.internal:1234/v1}
  RETRIV_EMBEDDING_API_KEY: ${RETRIV_EMBEDDING_API_KEY:?RETRIV_EMBEDDING_API_KEY is required}
  RETRIV_EMBEDDING_MODEL: ${RETRIV_EMBEDDING_MODEL:-text-embedding-qwen3-embedding-8b}
  RETRIV_EMBEDDING_PROFILE: ${RETRIV_EMBEDDING_PROFILE:-qwen3-embedding-8b-4096-v1}
  RETRIV_EMBEDDING_DIMENSIONS: ${RETRIV_EMBEDDING_DIMENSIONS:-4096}
  RETRIV_EMBEDDING_BATCH_SIZE: ${RETRIV_EMBEDDING_BATCH_SIZE:-16}
  RETRIV_EMBEDDING_TIMEOUT_SECONDS: ${RETRIV_EMBEDDING_TIMEOUT_SECONDS:-120}
  RETRIV_EMBEDDING_RECONCILIATION_INTERVAL_SECONDS: ${RETRIV_EMBEDDING_RECONCILIATION_INTERVAL_SECONDS:-300}
  # The vision stage. The worker is the only component that holds this key:
  # the API never describes a picture, and the extraction sandbox is
  # deliberately without a network.
  RETRIV_VLM_BASE_URL: ${RETRIV_VLM_BASE_URL:-https://zenmux.ai/api/v1/chat/completions}
  RETRIV_VLM_API_KEY: ${RETRIV_VLM_API_KEY:?RETRIV_VLM_API_KEY is required}
  RETRIV_VLM_MODEL: ${RETRIV_VLM_MODEL:-minimax/minimax-m3.1-flash}
  RETRIV_VLM_TIMEOUT_SECONDS: ${RETRIV_VLM_TIMEOUT_SECONDS:-120}
  RETRIV_VLM_MAX_TOKENS: ${RETRIV_VLM_MAX_TOKENS:-8192}
  RETRIV_VLM_MAX_TOKENS_CEILING: ${RETRIV_VLM_MAX_TOKENS_CEILING:-131072}
  RETRIV_VLM_MAX_IMAGES_PER_DOCUMENT: ${RETRIV_VLM_MAX_IMAGES_PER_DOCUMENT:-100}
  RETRIV_VLM_MAX_CONCURRENCY: ${RETRIV_VLM_MAX_CONCURRENCY:-4}
  RETRIV_VLM_MAX_DESCRIPTION_CHARS: ${RETRIV_VLM_MAX_DESCRIPTION_CHARS:-1200}
  RETRIV_MODEL_WAIT_BASE_SECONDS: ${RETRIV_MODEL_WAIT_BASE_SECONDS:-5}
  RETRIV_MODEL_WAIT_MAX_SECONDS: ${RETRIV_MODEL_WAIT_MAX_SECONDS:-60}
  RETRIV_MODEL_WAIT_TIMEOUT_SECONDS: ${RETRIV_MODEL_WAIT_TIMEOUT_SECONDS:-3600}
  RETRIV_IMAGE_PROCESSING_ENABLED: ${RETRIV_IMAGE_PROCESSING_ENABLED:-true}
  RETRIV_IMAGE_RENDER_SCALE: ${RETRIV_IMAGE_RENDER_SCALE:-2.0}
  RETRIV_IMAGE_MIN_PIXELS: ${RETRIV_IMAGE_MIN_PIXELS:-10000}
  RETRIV_MAX_IMAGE_BYTES: ${RETRIV_MAX_IMAGE_BYTES:-5242880}
  RETRIV_MAX_TOTAL_IMAGE_BYTES: ${RETRIV_MAX_TOTAL_IMAGE_BYTES:-52428800}
  RETRIV_QDRANT_URL: http://qdrant:6333
  RETRIV_QDRANT_API_KEY: ${RETRIV_QDRANT_API_KEY:?RETRIV_QDRANT_API_KEY is required}
  RETRIV_QDRANT_COLLECTION: ${RETRIV_QDRANT_COLLECTION:-retriv-chunks-qwen3-8b-4096-v1}
  RETRIV_QDRANT_TIMEOUT_SECONDS: ${RETRIV_QDRANT_TIMEOUT_SECONDS:-30}
  RETRIV_QDRANT_VECTORS_ON_DISK: ${RETRIV_QDRANT_VECTORS_ON_DISK:-true}
  RETRIV_PARSER_MEMORY_LIMIT_BYTES: ${RETRIV_PARSER_MEMORY_LIMIT_BYTES:-8589934592}
  RETRIV_PARSER_MAX_PROCESSES: ${RETRIV_PARSER_MAX_PROCESSES:-4096}
  RETRIV_S3_RAW_BUCKET: ${RETRIV_S3_RAW_BUCKET:-raw-documents}
  RETRIV_S3_ARTIFACT_BUCKET: ${RETRIV_S3_ARTIFACT_BUCKET:-context-documents}
  RETRIV_S3_REGION: ${RETRIV_S3_REGION:-us-east-1}
  RETRIV_S3_ADDRESSING_STYLE: ${RETRIV_S3_ADDRESSING_STYLE:-auto}

services:
  postgres:
    # Plain postgres: no vector column exists anywhere in the schema.
    # Vectors live in Qdrant, so the pgvector image was 250 MB of unused
    # extension for no benefit.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - app-net

  # Creates the read-only role the row-query tool connects as, and grants it
  # SELECT on the three tables. Runs once and exits.
  #
  # It exists because a password must never land in a migration, so 0002 and
  # 0003 grant to this role only if it already exists. Documenting "run this
  # CREATE ROLE by hand" produced a setup that migrated cleanly, failed to
  # start, and said nothing about which step was skipped. Here the step is part
  # of `docker compose up` and cannot be skipped by omission.
  postgres-init:
    image: postgres:17-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "/config/init.sh"]
    environment:
      PGHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      RETRIV_ENVIRONMENT: ${RETRIV_ENVIRONMENT:-local}
      RETRIV_SQL_READER_USER: ${RETRIV_SQL_READER_USER:-retriv_reader}
      RETRIV_SQL_READER_PASSWORD: ${RETRIV_SQL_READER_PASSWORD:?RETRIV_SQL_READER_PASSWORD is required}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./docker/postgres/init.sh:/config/init.sh:ro
    networks:
      - app-net

  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${RETRIV_QDRANT_API_KEY:?RETRIV_QDRANT_API_KEY is required}
      QDRANT__SERVICE__READ_ONLY_API_KEY: ${RETRIV_QDRANT_READ_ONLY_API_KEY:?RETRIV_QDRANT_READ_ONLY_API_KEY is required}
    healthcheck:
      test: ["CMD-SHELL", "bash -c ': > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    networks:
      - app-net

  clamav:
    image: clamav/clamav:1.4_base
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 60M
      CLAMD_CONF_MaxFileSize: 60M
      CLAMD_CONF_MaxScanSize: 120M
      CLAMD_CONF_AlertExceedsMax: "yes"
    mem_limit: 4g
    pids_limit: 512
    volumes:
      - clamav_data:/var/lib/clamav
    ports:
      - "127.0.0.1:3310:3310"
    networks:
      - app-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    restart: unless-stopped
    mem_limit: 10g
    cpus: 4
    pids_limit: 320
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=4g,mode=1777
    command: ["python", "-m", "worker"]
    environment:
      <<: *worker-environment
      RETRIV_S3_ENDPOINT_URL: ${RETRIV_S3_ENDPOINT_URL:-}
      RETRIV_S3_ACCESS_KEY: ${RETRIV_S3_ARTIFACT_ACCESS_KEY:?RETRIV_S3_ARTIFACT_ACCESS_KEY is required}
      RETRIV_S3_SECRET_KEY: ${RETRIV_S3_ARTIFACT_SECRET_KEY:?RETRIV_S3_ARTIFACT_SECRET_KEY is required}
      RETRIV_S3_ARTIFACT_ACCESS_KEY: ${RETRIV_S3_ARTIFACT_ACCESS_KEY:?RETRIV_S3_ARTIFACT_ACCESS_KEY is required}
      RETRIV_S3_ARTIFACT_SECRET_KEY: ${RETRIV_S3_ARTIFACT_SECRET_KEY:?RETRIV_S3_ARTIFACT_SECRET_KEY is required}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${RETRIV_DOCKER_SUBNET:-10.254.0.0/24}

volumes:
  postgres_data:
  qdrant_data:
  clamav_data:
